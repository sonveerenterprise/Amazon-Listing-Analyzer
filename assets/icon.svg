<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Amazon dark navy -->
  <rect width="256" height="256" rx="48" fill="#131921"/>

  <!-- Magnifying glass circle (enlarged) -->
  <circle cx="108" cy="82" r="76" fill="none" stroke="#FF9900" stroke-width="12"/>
  <!-- Magnifying glass handle -->
  <line x1="168" y1="142" x2="214" y2="188" stroke="#FF9900" stroke-width="16" stroke-linecap="round"/>

  <!-- "amazon" white text inside the lens -->
  <text x="108" y="72" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" letter-spacing="-1">amazon</text>

  <!-- Amazon smile orange arrow under the text -->
  <path d="M 58 90 Q 108 128 158 90" fill="none" stroke="#FF9900" stroke-width="6" stroke-linecap="round"/>
  <!-- smile arrow tip (pointing right, like amazon logo) -->
  <path d="M 152 84 L 164 96 L 148 100" fill="none" stroke="#FF9900" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "Listing Analysis" text below magnifying glass -->
  <text x="128" y="220" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Listing Analysis</text>
</svg>
